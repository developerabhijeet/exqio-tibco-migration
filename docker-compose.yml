services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: exiqo
      POSTGRES_USER: ${POSTGRES_USER:-exiqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exiqo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exiqo} -d exiqo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local development only: the cluster uses GM Financial's Neo4j (NEO4J_URI in the chart values).
  neo4j:
    image: neo4j:5.26.32
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-exiqo-dev-neo4j}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Tests only (profile `test`, started by `make test`): throwaway data on tmpfs, its own port.
  neo4j-test:
    image: neo4j:5.26.32
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/exiqo-test-neo4j
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "7688:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exiqo}:${POSTGRES_PASSWORD:-exiqo}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me}
      SALT: ${LANGFUSE_SALT:-change-me}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"

volumes:
  pgdata:
  neo4jdata:
