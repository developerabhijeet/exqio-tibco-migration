services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: exiqo
      POSTGRES_USER: ${POSTGRES_USER:-exiqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exiqo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exiqo} -d exiqo"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exiqo}:${POSTGRES_PASSWORD:-exiqo}@postgres:5432/exiqo
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me}
      SALT: ${LANGFUSE_SALT:-change-me}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"

volumes:
  pgdata:
