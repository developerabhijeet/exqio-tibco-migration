[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exiqo-migrate"
version = "0.1.0"
description = "ExiQO Migrate: TIBCO BusinessWorks to .NET migration platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "lxml",
  "elementpath",
  "saxonche",
  "fastembed",
  "jinja2",
  "pyyaml",
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "alembic",
  "pydantic-settings",
  "httpx",
  "sse-starlette",
  "python-multipart",
  "openai",
  "claude-agent-sdk",
  "psycopg[binary]",
  "neo4j>=5.20,<6",
  "pyjwt[crypto]>=2.8",
  "itsdangerous>=2.1",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff"]

# fastembed caps pillow below 13, and pillow 12.x carries CRITICAL CVEs (CVE-2026-112393 and others,
# fixed in 13.0.0). Only fastembed's image models use pillow; the engine embeds text only, and the
# image test loads the text model with this override in place. Drop it once fastembed allows 13.
[tool.uv]
override-dependencies = ["pillow>=13.0.0"]

[tool.setuptools.packages.find]
include = ["engine*", "api*"]

[tool.setuptools.package-data]
"engine.knowledge" = ["schema.sql", "seed_patterns.yaml", "prompts/*.md"]
"engine.agents" = ["prompts/*.md"]
"engine.infra_gen" = ["templates/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "api/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["samples"]
