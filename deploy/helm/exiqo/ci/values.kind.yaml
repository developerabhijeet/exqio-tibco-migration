# CI only (kind, `make kind-e2e`, deploy/kind/setup.sh): dev sign-in, a plain Kubernetes Secret
# instead of Key Vault, and ciEnv. x-ci is what lets values.schema.json accept AUTH_MODE=dev,
# keyVault.mode kubernetesSecret and ciEnv; never use this file, or x-ci, for an install. Layer it
# over values.gmf.example.yaml; setup.sh adds the image registry and digests of the images it built.
#
# The Secret (exiqo-ci-secrets) has one key per file under /mnt/secrets: database_url, app_secret,
# session_secret, internal_token, neo4j_password; the Neo4j subchart reads exiqo-neo4j-auth
# (key NEO4J_AUTH, "neo4j/<password>"). setup.sh creates both from random values before installing.
x-ci: true

# The seven-step demo without a model, an embedding download or a NuGet feed: the scripted fake
# provider, hash embeddings and no dotnet restore/build/test (scripts/demo_check.py --mode
# toolchain-off). A short JOB_STALE_SECONDS lets the worker-kill check see "worker lost" quickly.
ciEnv:
  PROVIDER: fake
  EMBEDDINGS_BACKEND: hash
  BUILD_TOOLCHAIN: "false"
  JOB_STALE_SECONDS: "20"

auth:
  mode: dev

keyVault:
  mode: kubernetesSecret
  kubernetesSecretName: exiqo-ci-secrets
  secrets:
    testDatabaseUrl: ""
    oidcClientSecret: ""

ingress:
  host: exiqo.localtest.me
  tlsSecretName: ""

# Memory sized so the install runs in about 4 GB of a Docker VM (a developer laptop that runs
# other containers too, a GitHub runner): with the larger limits this file had, a `dotnet run` in
# a worker (Verify's service start, which BUILD_TOOLCHAIN does not switch off) drove the kind node
# into a system OOM that froze the API server. A container over its limit is now killed alone.
api:
  tmpSize: 3Gi
  resources:
    requests: {cpu: 100m, memory: 384Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "1", memory: 768Mi, ephemeral-storage: 4Gi}

web:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

# Two of each, as in an install: the worker-kill check deletes one worker mid-build.
worker:
  replicas: 2
  maxReplicas: 2
  resources:
    requests: {cpu: 250m, memory: 384Mi, ephemeral-storage: 2Gi}
    limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 8Gi}
  tmpSize: 4Gi
  nugetCacheSize: 3Gi

# Postgres runs in its own namespace (deploy/kind/postgres.yaml), standing in for Azure Database for
# PostgreSQL: the platform egress policy admits it by namespace.
postgres:
  host: postgres.exiqo-db.svc.cluster.local

egress:
  allowNamespaces: [exiqo-db]

# kind's local-path provisioner: one node, so ReadWriteOnce is shared by every pod.
data:
  storageClass:
    create: false
    name: standard
  size: 5Gi
  accessMode: ReadWriteOnce

neo4jBackup:
  enabled: false

neo4j:
  volumes:
    data:
      dynamic:
        storageClassName: standard
        requests: {storage: 2Gi}
  neo4j:
    resources: {cpu: 500m, memory: 2Gi}
  config:
    # the subchart's minimum container size is 2Gi; the JVM is kept far below it
    server.memory.heap.initial_size: 256m
    server.memory.heap.max_size: 256m
    server.memory.pagecache.size: 64m
  # No CSI driver in kind: the auth Secret is created by the CI job.
  additionalVolumes:
    - name: tmp
      emptyDir: {sizeLimit: 1Gi}
    - name: runtime-conf
      emptyDir: {sizeLimit: 16Mi}
  additionalVolumeMounts:
    - {name: tmp, mountPath: /tmp}
    - {name: runtime-conf, mountPath: /var/lib/neo4j/conf}
