# A complete GMF install, to copy and fill in (every id, address and name below is a placeholder).
#
#   helm upgrade --install exiqo deploy/helm/exiqo -n exiqo -f values.gmf.yaml
#
# Before the first install: the Secrets Store CSI driver (AKS add-on azure-keyvault-secrets-provider)
# and Workload Identity are enabled on the cluster; the Key Vault holds the objects named under
# keyVault.secrets; the identities and federated credentials listed at the top of values.yaml
# exist; the namespace has the TLS Secret (ingress.tlsSecretName).

image:
  registry: gmfacr.azurecr.io
  platform:
    repository: exiqo/exiqo-platform
    digest: sha256:4f2d9c1e8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e
  web:
    repository: exiqo/exiqo-web
    digest: sha256:9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d

brand:
  name: ExiQO
  supportContact: Platform Engineering, platform-engineering@gmfinancial.example

auth:
  mode: oidc
  tenantId: 3b2f8a64-1c2d-4e5f-9a8b-7c6d5e4f3a2b
  clientId: 8a7b6c5d-4e3f-4a1b-9c8d-7e6f5a4b3c2d
  roleGroups:
    admin: [1a2b3c4d-0000-4000-8000-000000000001]
    viewer: [1a2b3c4d-0000-4000-8000-000000000002]
    sme: [1a2b3c4d-0000-4000-8000-000000000003, Exiqo.Sme]
    architect: [1a2b3c4d-0000-4000-8000-000000000004]
    engineer: [1a2b3c4d-0000-4000-8000-000000000005]
    qa: [1a2b3c4d-0000-4000-8000-000000000006]
    ops: [1a2b3c4d-0000-4000-8000-000000000007]

deploy:
  credentialMode: workload_identity
  environments:
    - name: dev
      subscription: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
      auth: workload_identity
    - name: prod
      subscription: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
      auth: workload_identity

identity:
  platformClientId: 6f1c2d3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f   # exiqo-platform
  deployIdentities:                                       # each federated for exiqo-worker
    dev: 0d9e8f7a-6b5c-4d3e-a2f1-0e9d8c7b6a50              # exiqo-deploy-dev
    prod: 7c6b5a4f-3e2d-4c1b-a0f9-e8d7c6b5a4f3             # exiqo-deploy-prod

keyVault:
  mode: csi
  name: kv-gmf-exiqo-prod
  secrets:
    databaseUrl: exiqo-database-url
    testDatabaseUrl: exiqo-test-database-url
    appSecret: exiqo-app-secret
    sessionSecret: exiqo-session-secret
    internalToken: exiqo-internal-token
    neo4jPassword: exiqo-neo4j-password
    neo4jAuth: exiqo-neo4j-auth
    oidcClientSecret: exiqo-oidc-client-secret

ingress:
  className: nginx
  host: exiqo.apps.gmfinancial.example
  tlsSecretName: exiqo-tls

postgres:
  host: gmf-exiqo-pg.postgres.database.azure.com
  cidrs: [10.20.30.0/28]

egress:
  # Private endpoints subnet (Key Vault, Azure OpenAI, Blob, the mirrors) and Entra ID's range
  # (or the Azure Firewall's address when egress is forced through it).
  allowCidrs: [10.40.0.0/24, 20.190.128.0/18]
  fqdns:
    - login.microsoftonline.com
    - "*.vault.azure.net"
    - management.azure.com
    - gmf-exiqo-aoai.openai.azure.com
    - stgmfexiqobackup.blob.core.windows.net
    - artifactory.gmfinancial.example

networkPolicy:
  ingressNamespaces: [ingress-nginx]
  kubeApiCidrs: [10.50.0.4/32]   # the private cluster's API server address

providers:
  azureOpenAI:
    endpoint: https://gmf-exiqo-aoai.openai.azure.com
    apiVersion: "2024-10-21"
    auth: managed_identity
    deployments: {strong: gpt-4o, standard: gpt-4o, efficient: gpt-4o-mini}

mirrors:
  nuget: https://artifactory.gmfinancial.example/api/nuget/v3/nuget-remote/index.json
  npm: https://artifactory.gmfinancial.example/api/npm/npm-remote/
  terraformConfig: |
    provider_installation {
      network_mirror {
        url = "https://artifactory.gmfinancial.example/api/terraform/terraform-remote/providers/"
      }
    }

neo4jBackup:
  storageAccount: stgmfexiqobackup
  container: neo4j-backups
