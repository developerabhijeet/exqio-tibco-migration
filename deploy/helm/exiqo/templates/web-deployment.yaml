{{- /*
The web UI (node server.js, distroless) on 3000. The browser calls /api on the same origin; the
server never calls the API, so this pod has no secret, no service account token and no egress
beyond DNS.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exiqo-web
  labels:
    {{- include "exiqo.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "exiqo.selector" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exiqo.componentLabels" (dict "ctx" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: exiqo-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "exiqo.podSecurityContext" . | nindent 8 }}
      {{- include "exiqo.imagePullSecrets" . | nindent 6 }}
      {{- include "exiqo.spread" (dict "ctx" . "component" "web") | nindent 6 }}
      containers:
        - name: web
          image: {{ include "exiqo.image" (dict "ctx" . "which" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "exiqo.containerSecurityContext" dict | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # The Next.js cache (.next/cache links to /tmp/next-cache in the image).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
