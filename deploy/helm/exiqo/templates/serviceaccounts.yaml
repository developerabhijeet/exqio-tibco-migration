{{- /*
One service account per workload; none mounts a Kubernetes API token (the Workload Identity webhook
projects its own token where the pod is labeled). The platform identity must hold a federated
credential for each account that reads Key Vault (exiqo-api, exiqo-worker, exiqo-neo4j; exiqo-migrate
and exiqo-neo4j-backup are in their own templates), and every deploy identity one for exiqo-worker.
*/ -}}
{{- $platform := .Values.identity.platformClientId -}}
{{- range $name := list "api" "worker" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exiqo-{{ $name }}
  labels:
    {{- include "exiqo.componentLabels" (dict "ctx" $ "component" $name) | nindent 4 }}
  {{- if and (ne $name "web") $platform }}
  annotations:
    azure.workload.identity/client-id: {{ $platform | quote }}
    azure.workload.identity/tenant-id: {{ $.Values.auth.tenantId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.neo4j.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exiqo-neo4j
  labels:
    {{- include "exiqo.componentLabels" (dict "ctx" . "component" "neo4j") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
