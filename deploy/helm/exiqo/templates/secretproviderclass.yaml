{{- /*
Key Vault through the Secrets Store CSI driver (Azure provider) with Workload Identity: the driver
requests a token for the pod's service account and exchanges it for the platform identity
(clientID). Each object is mounted as /mnt/secrets/<objectAlias>, read-only.

exiqo-neo4j also syncs NEO4J_AUTH into the Kubernetes Secret exiqo-neo4j-auth, because the Neo4j
subchart reads its initial password from a Secret. The sync exists while a pod mounts the class
(the Neo4j pod does), and it puts that value in etcd: GMF's AKS should run with etcd encryption at
rest using a customer-managed key (KMS), as for any Secret.
The migration hook has its own class (migrate-job.yaml): hooks run before these exist.
*/ -}}
{{- if eq .Values.keyVault.mode "csi" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: exiqo-platform
  labels:
    {{- include "exiqo.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    {{- include "exiqo.spcParameters" (dict "ctx" . "objects" (include "exiqo.platformSecrets" . | fromYamlArray)) | nindent 4 }}
{{- if .Values.neo4j.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: exiqo-neo4j
  labels:
    {{- include "exiqo.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    {{- $obj := required "keyVault.secrets.neo4jAuth is required with neo4j.enabled" .Values.keyVault.secrets.neo4jAuth }}
    {{- include "exiqo.spcParameters" (dict "ctx" . "objects" (list (dict "object" $obj "file" "neo4j_auth"))) | nindent 4 }}
  secretObjects:
    - secretName: {{ .Values.neo4j.neo4j.passwordFromSecret }}
      type: Opaque
      data:
        - objectName: neo4j_auth
          key: NEO4J_AUTH
{{- end }}
{{- end }}
