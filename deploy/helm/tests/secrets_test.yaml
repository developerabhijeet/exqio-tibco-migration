# No secret value in a pod spec (Global Constraints): every credential is a file from Key Vault,
# named by <NAME>_FILE. An env entry for a credential name with an inline value (or any value)
# fails here, whatever the template.
suite: secrets are files
values:
  - ../exiqo/values.gmf.example.yaml
templates:
  - templates/api-deployment.yaml
  - templates/worker-deployment.yaml
  - templates/web-deployment.yaml
  - templates/migrate-job.yaml
  - templates/configmap.yaml
  - templates/secretproviderclass.yaml
tests:
  - it: no credential variable is set inline in the api, worker or web pods
    templates:
      - templates/api-deployment.yaml
      - templates/worker-deployment.yaml
      - templates/web-deployment.yaml
    asserts: &noInline
      - notExists:
          path: "spec.template.spec.containers[*].env[?(@.name =~ /.*(_SECRET|_PASSWORD|_KEY|_TOKEN|DATABASE_URL)$/)]"
      - notExists:
          path: "spec.template.spec.initContainers[*].env[?(@.name =~ /.*(_SECRET|_PASSWORD|_KEY|_TOKEN|DATABASE_URL)$/)]"
  - it: no credential variable is set inline in the migration hook
    template: templates/migrate-job.yaml
    documentSelector: {path: kind, value: Job}
    asserts: *noInline
  - it: the shared ConfigMap carries no credential variable
    template: templates/configmap.yaml
    asserts:
      - notExists: {path: "data.DATABASE_URL"}
      - notExists: {path: "data.APP_SECRET"}
      - notExists: {path: "data.SESSION_SECRET"}
      - notExists: {path: "data.INTERNAL_TOKEN"}
      - notExists: {path: "data.NEO4J_PASSWORD"}
      - notExists: {path: "data.OIDC_CLIENT_SECRET"}
      - notExists: {path: "data.AZURE_OPENAI_API_KEY"}
      - notExists: {path: "data.CLAUDE_CODE_OAUTH_TOKEN"}
      - notExists: {path: "data.LANGFUSE_SECRET_KEY"}
  - it: the api reads each configured secret from /mnt/secrets
    template: templates/api-deployment.yaml
    asserts:
      - contains: &dbFile
          path: spec.template.spec.containers[0].env
          content: {name: DATABASE_URL_FILE, value: /mnt/secrets/database_url}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: APP_SECRET_FILE, value: /mnt/secrets/app_secret}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SESSION_SECRET_FILE, value: /mnt/secrets/session_secret}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: INTERNAL_TOKEN_FILE, value: /mnt/secrets/internal_token}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: NEO4J_PASSWORD_FILE, value: /mnt/secrets/neo4j_password}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OIDC_CLIENT_SECRET_FILE, value: /mnt/secrets/oidc_client_secret}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secrets
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes: {secretProviderClass: exiqo-platform}
  - it: the worker never gets the sign-in secrets (it runs generated code as its own UID)
    template: templates/worker-deployment.yaml
    asserts:
      - notExists:
          path: "spec.template.spec.containers[*].env[?(@.name == 'SESSION_SECRET_FILE')]"
      - notExists:
          path: "spec.template.spec.containers[*].env[?(@.name == 'OIDC_CLIENT_SECRET_FILE')]"
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DATABASE_URL_FILE, value: /mnt/secrets/database_url}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEST_DATABASE_URL_FILE, value: /mnt/secrets/test_database_url}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: APP_SECRET_FILE, value: /mnt/secrets/app_secret}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: INTERNAL_TOKEN_FILE, value: /mnt/secrets/internal_token}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: NEO4J_PASSWORD_FILE, value: /mnt/secrets/neo4j_password}
      - equal:
          path: "spec.template.spec.volumes[?(@.name == 'secrets')].csi.volumeAttributes.secretProviderClass"
          value: exiqo-platform-worker
  - it: the worker's provider class leaves out the sign-in secrets the api's carries
    template: templates/secretproviderclass.yaml
    documentSelector: {path: metadata.name, value: exiqo-platform-worker}
    asserts:
      - notMatchRegex: {path: spec.parameters.objects, pattern: exiqo-session-secret}
      - notMatchRegex: {path: spec.parameters.objects, pattern: session_secret}
      - notMatchRegex: {path: spec.parameters.objects, pattern: exiqo-oidc-client-secret}
      - notMatchRegex: {path: spec.parameters.objects, pattern: oidc_client_secret}
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: exiqo-internal-token\\s+objectAlias: internal_token"
      - equal: {path: spec.parameters.clientID, value: 6f1c2d3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f}
  - it: the api's provider class carries the sign-in secrets
    template: templates/secretproviderclass.yaml
    documentSelector: {path: metadata.name, value: exiqo-platform}
    asserts:
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: exiqo-session-secret\\s+objectAlias: session_secret"
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: exiqo-oidc-client-secret\\s+objectAlias: oidc_client_secret"
  - it: with the CI Secret the worker projects only its own keys
    template: templates/worker-deployment.yaml
    values:
      - ../exiqo/values.gmf.example.yaml
      - ../exiqo/ci/values.kind.yaml
    asserts:
      - equal:
          path: "spec.template.spec.volumes[?(@.name == 'secrets')].secret.items"
          value:
            - {key: database_url, path: database_url}
            - {key: app_secret, path: app_secret}
            - {key: internal_token, path: internal_token}
            - {key: neo4j_password, path: neo4j_password}
  - it: with the CI Secret the api projects its keys, sign-in included
    template: templates/api-deployment.yaml
    values:
      - ../exiqo/values.gmf.example.yaml
      - ../exiqo/ci/values.kind.yaml
    asserts:
      - contains:
          path: "spec.template.spec.volumes[?(@.name == 'secrets')].secret.items"
          content: {key: session_secret, path: session_secret}
  - it: a secret without a Key Vault object gets no _FILE variable
    template: templates/api-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: CLAUDE_CODE_OAUTH_TOKEN_FILE, value: /mnt/secrets/claude_code_oauth_token}
  - it: the Claude token is mounted only when the Claude provider is enabled
    template: templates/api-deployment.yaml
    set:
      providers.claude.enabled: true
      keyVault.secrets.claudeCodeOauthToken: exiqo-claude-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLAUDE_CODE_OAUTH_TOKEN_FILE, value: /mnt/secrets/claude_code_oauth_token}
  - it: the migration hook reads only DATABASE_URL, from its own provider class
    template: templates/migrate-job.yaml
    documentSelector: {path: kind, value: Job}
    asserts:
      - contains: *dbFile
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: APP_SECRET_FILE, value: /mnt/secrets/app_secret}
      - equal:
          path: "spec.template.spec.volumes[?(@.name == 'secrets')].csi.volumeAttributes.secretProviderClass"
          value: exiqo-migrate
  - it: the platform provider class authenticates with Workload Identity, no pod identity
    template: templates/secretproviderclass.yaml
    documentSelector: {path: metadata.name, value: exiqo-platform}
    asserts:
      - equal: {path: spec.provider, value: azure}
      - equal: {path: spec.parameters.usePodIdentity, value: "false"}
      - equal: {path: spec.parameters.clientID, value: 6f1c2d3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f}
      - equal: {path: spec.parameters.keyvaultName, value: kv-gmf-exiqo-prod}
      - equal: {path: spec.parameters.tenantId, value: 3b2f8a64-1c2d-4e5f-9a8b-7c6d5e4f3a2b}
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: exiqo-database-url\\s+objectAlias: database_url\\s+objectType: secret"
  - it: the Neo4j provider class syncs NEO4J_AUTH into the Secret the subchart reads
    template: templates/secretproviderclass.yaml
    documentSelector: {path: metadata.name, value: exiqo-neo4j}
    asserts:
      - equal:
          path: spec.secretObjects
          value:
            - secretName: exiqo-neo4j-auth
              type: Opaque
              data: [{objectName: neo4j_auth, key: NEO4J_AUTH}]
      - notMatchRegex:
          path: spec.parameters.objects
          pattern: database
