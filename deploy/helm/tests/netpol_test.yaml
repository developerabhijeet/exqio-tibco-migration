# Default deny in both directions, then one policy per allowed path (spec section 2, "Network").
suite: network policies
values:
  - ../exiqo/values.gmf.example.yaml
templates:
  - templates/networkpolicies.yaml
tests:
  - it: denies all ingress and egress by default
    documentSelector: {path: metadata.name, value: exiqo-default-deny}
    asserts:
      - equal: {path: spec.podSelector, value: {}}
      - equal: {path: spec.policyTypes, value: [Ingress, Egress]}
      - notExists: {path: spec.ingress}
      - notExists: {path: spec.egress}
  - it: worker port 9100 admits the api pods only
    documentSelector: {path: metadata.name, value: exiqo-worker-ingress}
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value: {app.kubernetes.io/name: exiqo, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: worker}
      - equal: {path: spec.policyTypes, value: [Ingress]}
      - lengthEqual: {path: spec.ingress, count: 1}
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector:
                matchLabels: {app.kubernetes.io/name: exiqo, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: api}
      - equal: {path: "spec.ingress[0].ports", value: [{port: 9100, protocol: TCP}]}
  - it: the api admits the ingress controller only, on 8000
    documentSelector: {path: metadata.name, value: exiqo-api-ingress}
    asserts:
      - equal:
          path: spec.ingress[0].from[0]
          value: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}
      - equal: {path: "spec.ingress[0].ports", value: [{port: 8000, protocol: TCP}]}
  - it: web admits the ingress controller only, on 3000
    documentSelector: {path: metadata.name, value: exiqo-web-ingress}
    asserts:
      - equal:
          path: spec.ingress[0].from[0]
          value: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}
      - equal: {path: "spec.ingress[0].ports", value: [{port: 3000, protocol: TCP}]}
  - it: neo4j bolt admits api, worker and backup only
    documentSelector: {path: metadata.name, value: exiqo-neo4j-ingress}
    asserts:
      - equal: {path: spec.podSelector.matchLabels, value: {app: exiqo-neo4j}}
      - equal: {path: "spec.ingress[0].ports", value: [{port: 7687, protocol: TCP}]}
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchExpressions
          value:
            - {key: app.kubernetes.io/component, operator: In, values: [api, worker, neo4j-backup]}
  - it: every pod may resolve names through kube-dns
    documentSelector: {path: metadata.name, value: exiqo-dns-egress}
    asserts:
      - equal: {path: spec.podSelector, value: {}}
      - equal:
          path: spec.egress[0].to[0]
          value:
            namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
            podSelector: {matchLabels: {k8s-app: kube-dns}}
  - it: platform egress goes to the listed CIDRs and Postgres only
    documentSelector: {path: metadata.name, value: exiqo-platform-egress}
    asserts:
      - equal:
          path: spec.podSelector.matchExpressions
          value: [{key: app.kubernetes.io/component, operator: In, values: [api, worker, migrate]}]
      - contains:
          path: spec.egress
          content:
            to: [{ipBlock: {cidr: 10.20.30.0/28}}]
            ports: [{port: 5432, protocol: TCP}]
      - contains:
          path: spec.egress
          content:
            to: [{ipBlock: {cidr: 10.40.0.0/24}}, {ipBlock: {cidr: 20.190.128.0/18}}]
            ports: [{port: 443, protocol: TCP}]
