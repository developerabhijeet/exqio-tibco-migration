# ExiQO Migrate release for Azure DevOps: Build -> Scan -> Sign -> Deploy (environment approval),
# the same flow as github-release.yml; both call deploy/pipelines/release.sh.
#
# Runs after CI (unit tests, make chart-check), on a v* tag or by hand. The tests are not rerun
# here: this pipeline releases the commit CI already passed.
#
# Three identities, one per privilege, each behind its own Azure Resource Manager service
# connection with workload identity federation (no stored secret). The approval and the
# sign-after-scan order then rest on what each stage can do, not only on stage order:
#
#   parameter                  stages        identity
#   buildServiceConnection     Build, Scan   build: AcrPush on the registry only
#   signServiceConnection      Sign          signer: AcrPush + Key Vault Crypto User on the key
#   deployServiceConnection    Deploy        deployer: AcrPull + its AKS role (deploy/azure README)
#
# deploy/azure grants these from build_principal_id, signer_principal_id and deployer_principal_id
# (the deployer's AKS role only if deployer_aks_role opts in). cosign signs with the sign
# connection's federated token (idToken), so the key never leaves Key Vault; Deploy verifies with
# the committed public key and holds no Key Vault access. Checks to add (Project settings >
# Service connections > Approvals and checks):
#   signServiceConnection     Branch control: allowed branches refs/tags/v* (verify branch
#                             protection on), so only a release tag can sign.
#   deployServiceConnection   Branch control refs/tags/v* and Approvals; the environment below
#                             also carries an Approvals check.
#
# Trust in the signing key does not rest on the repository: Deploy verifies with the committed
# COSIGN_PUBLIC_KEY_FILE only if its sha256 equals COSIGN_PUBLIC_KEY_SHA256 from the variable group
# exiqo-release-deploy (bound to the Deploy stage only, with an Approvals check and pipeline
# permission limited to this pipeline; value: deploy/azure's cosign_public_key_sha256), and
# refuses when it is unset or differs. Also set up: the "Create tag" permission (repository
# security) for release managers only, and required reviewers (branch policy) on
# deploy/gmf/cosign.pub and deploy/pipelines/.
#
# Variable group exiqo-release (plain variables, no secrets; Azure Pipelines exposes each one to
# the scripts as an environment variable of the same name):
#   ACR_NAME, REGISTRY                    GMF's registry and its login server (gmfacr.azurecr.io)
#   PLATFORM_REPOSITORY, WEB_REPOSITORY   e.g. exiqo/exiqo-platform, exiqo/exiqo-web
#   TOOL_REGISTRY                         GMF's mirror of Docker Hub/ghcr/gcr images (tool images)
#   BASE_IMAGE_DOTNET, BASE_IMAGE_UV, BASE_IMAGE_NODE_BUILD, BASE_IMAGE_NODE_RUNTIME
#                                         the mirrored base images, by digest
#   PIP_INDEX_URL, HF_ENDPOINT, NPM_CONFIG_REGISTRY, TERRAFORM_BASE_URL, TERRAGRUNT_BASE_URL
#                                         package and download mirrors for the image builds
#   TRIVY_DB_REPOSITORY, TRIVY_JAVA_DB_REPOSITORY   mirrored Trivy databases (OCI references)
#   COSIGN_KEY                            azurekms://<vault>.vault.azure.net/<key> (deploy/azure output)
#   COSIGN_PUBLIC_KEY_FILE                the committed public key, e.g. deploy/gmf/cosign.pub
#                                         (terraform output -raw cosign_public_key_pem)
#   AKS_RESOURCE_GROUP, AKS_NAME, NAMESPACE           the target cluster
#   HELM_VALUES_FILES                     space-separated, e.g. "deploy/gmf/values.gmf.yaml
#                                         deploy/gmf/values.azure.json"
#   NEO4J_CHART_REPOSITORY                GMF's mirror of https://helm.neo4j.com/neo4j
#
# The approval lives on the Azure DevOps environment (parameter environment): add an Approvals
# check to it. Tasks are pinned to an exact version (AzureCLI@2.282.2); an organization or Azure
# DevOps Server that does not have that build yet needs the nearest version it has.

trigger:
  branches:
    exclude: ["*"]
  tags:
    include: ["v*"]

pr: none

parameters:
  - name: buildServiceConnection
    displayName: Build and Scan service connection (build identity, AcrPush)
    type: string
    default: exiqo-release-build
  - name: signServiceConnection
    displayName: Sign service connection (signer identity)
    type: string
    default: exiqo-release-sign
  - name: deployServiceConnection
    displayName: Deploy service connection (deployer identity)
    type: string
    default: exiqo-release-deploy
  - name: environment
    displayName: Azure DevOps environment (carries the approval)
    type: string
    default: exiqo-production
  - name: pool
    displayName: Agent pool (linux/amd64 with docker, the Azure CLI, make and python3)
    type: object
    default:
      vmImage: ubuntu-24.04

variables:
  - group: exiqo-release

stages:
  - stage: Build
    jobs:
      - job: Build
        pool: ${{ parameters.pool }}
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
          - task: AzureCLI@2.282.2
            name: build
            displayName: hadolint, build linux/amd64 and push the candidates
            inputs:
              azureSubscription: ${{ parameters.buildServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                deploy/pipelines/release.sh build >"$(Agent.TempDirectory)/digests"
                while IFS='=' read -r key value; do
                  echo "##vso[task.setvariable variable=$key;isOutput=true]$value"
                done <"$(Agent.TempDirectory)/digests"

  - stage: Scan
    dependsOn: Build
    variables:
      PLATFORM_DIGEST: $[ stageDependencies.Build.Build.outputs['build.platform_digest'] ]
      WEB_DIGEST: $[ stageDependencies.Build.Build.outputs['build.web_digest'] ]
    jobs:
      - job: Scan
        pool: ${{ parameters.pool }}
        timeoutInMinutes: 45
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
          - task: AzureCLI@2.282.2
            displayName: Egress audit and Trivy (fails on CRITICAL, .trivyignore applies)
            inputs:
              azureSubscription: ${{ parameters.buildServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: deploy/pipelines/release.sh scan

  - stage: Sign
    dependsOn: [Build, Scan]
    variables:
      PLATFORM_DIGEST: $[ stageDependencies.Build.Build.outputs['build.platform_digest'] ]
      WEB_DIGEST: $[ stageDependencies.Build.Build.outputs['build.web_digest'] ]
    jobs:
      - job: Sign
        pool: ${{ parameters.pool }}
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
          - task: AzureCLI@2.282.2
            displayName: SBOM attestation, signature and release tag
            inputs:
              azureSubscription: ${{ parameters.signServiceConnection }}
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                token_file="$(Agent.TempDirectory)/azure-federated-token"
                (umask 077 && printf '%s' "$idToken" >"$token_file")
                AZURE_CLIENT_ID="$servicePrincipalId" AZURE_TENANT_ID="$tenantId" \
                  AZURE_FEDERATED_TOKEN_FILE="$token_file" deploy/pipelines/release.sh sign
                rm -f "$token_file"

  - stage: Deploy
    dependsOn: [Build, Sign]
    variables:
      - group: exiqo-release-deploy  # COSIGN_PUBLIC_KEY_SHA256 (approval-gated)
      - name: PLATFORM_DIGEST
        value: $[ stageDependencies.Build.Build.outputs['build.platform_digest'] ]
      - name: WEB_DIGEST
        value: $[ stageDependencies.Build.Build.outputs['build.web_digest'] ]
    jobs:
      - deployment: Deploy
        pool: ${{ parameters.pool }}
        timeoutInMinutes: 40
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  persistCredentials: false
                - task: AzureCLI@2.282.2
                  displayName: Verify the signatures, then helm upgrade --install --atomic
                  inputs:
                    azureSubscription: ${{ parameters.deployServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: deploy/pipelines/release.sh deploy
